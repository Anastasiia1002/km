# Nginx snippet for km-trade.net — put inside the server { } block for the site.
# Without this, try_files / SPA fallback serves index.html for /client-nexus-portal/
# and the PHP form looks "unavailable".

# 1) Real PHP portal (must exist on disk under public_html/client-nexus-portal/)
# Prefer root over alias — fewer edge cases with try_files and php-fpm.
location ^~ /client-nexus-portal/ {
    root /home/admin/web/km-trade.net/public_html;
    index index.php;

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php-fpm.sock;  # adjust to your myVESTA php-fpm socket
    }

    # Block script execution in uploads/logs
    location ~* ^/client-nexus-portal/(uploads|logs)/ {
        location ~ \.php$ { return 403; }
    }

    try_files $uri $uri/ /client-nexus-portal/index.php?$query_string;
}

# 2) SPA fallback must NOT catch the portal (example — keep your existing root location,
# but exclude the portal prefix):
#
# location / {
#     try_files $uri $uri/ /index.html;
# }
#
# If you already have try_files for the React app, ensure /client-nexus-portal/
# is handled by the block above ( ^~ wins over prefix locations ).

